[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "lissajous-phase-control"
version = "1.0.0"
description = "Phase-only camera feedback for a known 100 Hz-grid input"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<14"]

[tool.setuptools.packages.find]
include = ["phase_control*"]
