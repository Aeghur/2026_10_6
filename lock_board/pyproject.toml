[build-system]
requires=["setuptools>=65"]
build-backend="setuptools.build_meta"

[project]
name="lissajous-optical-lock"
version="2.1.0"
description="Optical phase acquisition with retained evidence and bounded local frequency tracking"
requires-python=">=3.10"
dependencies=["numpy>=1.24,<3","Pillow>=10,<14"]

[tool.setuptools.packages.find]
include=["lock_control*"]

[tool.setuptools.package-data]
lock_control=["assets/*.npz","assets/*.json"]
