[build-system]
requires=["setuptools>=65"]
build-backend="setuptools.build_meta"

[project]
name="lissajous-optical-lock"
version="2.0.0"
description="Known-frequency optical feedback with bounded DDS trim and learned probe selection"
requires-python=">=3.10"
dependencies=["numpy>=1.24,<3","Pillow>=10,<14"]

[tool.setuptools.packages.find]
include=["lock_control*"]

[tool.setuptools.package-data]
lock_control=["assets/*.npz","assets/*.json"]
